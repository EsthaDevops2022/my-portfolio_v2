
name: CI

on:
  
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  build:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
              docker build -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio_v2:${{ github.run_number }} .
              docker build -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio_v2 .

      - name: Push image
        run: |
              echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
              docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio_v2:${{ github.run_number }}
              docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio_v2

  deploy:

    needs: build
    runs-on: ubuntu-latest       
    steps:   
      - name: SSH to Server  
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          #port: ${{ secrets.PORT }}
          script: |
                  docker rm -f resume
                  docker run -d --name resume -p 8080:5001 ${{ secrets.DOCKER_USERNAME }}/my-portfolio_v2:${{ github.run_number }}