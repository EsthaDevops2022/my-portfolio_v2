
name: CI

on:
  
  push:#
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  
  build:
    
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t esthadevops2022/my-portfolio_v2 .

      - name: Push image
        run: |
          docker login -u esthadevops -p ${{secrets.REGISTRY_PASS}}
          docker push esthadevops2022/my-portfolio_v2
